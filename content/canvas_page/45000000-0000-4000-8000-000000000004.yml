        text: '<p>This campaign is for Demo City account holders or authorized household members carrying a past-due water bill. Start with the service page below — it publishes its direct answer, eligibility, next action, and last-reviewed date as structured fields, so what you read is what the city governs. Not sure you qualify? Read the eligibility answer before you start.</p>'
