name: 'GEO Starter'
description: 'A governed, GEO-friendly migration starter for structured, sourceable content that is easier for people and retrieval systems to inspect.'
type: Site

recipes:
  - core/recipes/administrator_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_performance
  - drupal_cms_admin_ui
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic

install:
  - block
  - canvas
  - ckeditor5
  - content_moderation
  - datetime
  - editor
  - entity_reference_revisions
  - field
  - file
  - filter
  - geo_starter_jsonld
  - image
  - jsonapi
  - link
  - media
  - media_library
  - node
  - office_hours
  - options
  - paragraphs
  - path
  - path_alias
  - mercury
  - taxonomy
  - text
  - user
  - views
  - workflows

config:
  strict: false
  actions:
    system.theme:
      simpleConfigUpdate:
        default: mercury
    # Front page = the canvas_page shell shipped in content/canvas_page/
    # (alias verified in 45000000-…001.yml). Dotted key on purpose: a nested
    # `page:` map would replace the whole map and wipe page.403/404.
    # Gate-proven 2026-06-05 on a fresh site:install (beta plan WS-A rev. 4).
    system.site:
      simpleConfigUpdate:
        page.front: /geo-starter

extra:
  recipe_installer_kit:
    finish_url: '/admin/dashboard/welcome'
