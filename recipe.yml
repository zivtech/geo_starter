name: 'GEO Starter'
description: 'A governed, GEO-friendly migration starter for structured, sourceable content that is easier for people and retrieval systems to inspect.'
type: Site

recipes:
  - core/recipes/administrator_role
  - core/recipes/core_recommended_maintenance
  - core/recipes/core_recommended_performance
  - drupal_cms_admin_ui
  - drupal_cms_media
  - drupal_cms_privacy_basic
  - drupal_cms_seo_basic

install:
  - block
  - canvas
  - ckeditor5
  - content_moderation
  - datetime
  - editor
  - entity_reference_revisions
  - field
  - file
  - filter
  - image
  - jsonapi
  - link
  - media
  - media_library
  - node
  - options
  - paragraphs
  - path
  - path_alias
  - taxonomy
  - text
  - user
  - views
  - workflows

config:
  strict: false

extra:
  recipe_installer_kit:
    finish_url: '/admin/dashboard/welcome'
