name: geo-starter
type: drupal
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
database:
  type: mariadb
  version: "10.11"
composer_version: "2"
corepack_enable: false
# GEO Starter is a `type: drupal-recipe` package — it is not itself an
# installable Drupal project. This DDEV config exists so a developer (or an
# AI coding agent) can clone the recipe and stand up a full, working Drupal
# CMS site with the recipe applied in one command:
#
#     ddev start && ddev geo-install
#
# `web/` is created by `ddev geo-install` (composer create-project drupal/cms).
# This file is committed to git so cloners get the quickstart, but it is
# export-ignored from the Composer artifact (.gitattributes) so the published
# recipe stays lean — end users who `composer require drupal/geo_starter` into
# an existing project do not need it.
hooks:
  post-start:
    - exec: "test -f web/index.php || echo '👉 Run: ddev geo-install  (creates the Drupal CMS site and applies the GEO Starter recipe)'"
