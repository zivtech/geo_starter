name: geo-starter
type: drupal
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
database:
  type: mariadb
  version: "10.11"
composer_version: "2"
corepack_enable: false
# GEO Starter is a `type: drupal-recipe` package — it is not itself an
# installable Drupal project. This DDEV config exists so a developer (or an
# AI coding agent) can inspect a recipe checkout. It is not an installation
# route. The sole supported one-command installer is tools/quickstart.sh.
# This file is export-ignored from the Composer artifact (.gitattributes).
hooks:
  post-start:
    - exec: "test -f web/index.php || echo 'GEO Starter: run tools/quickstart.sh <directory> [tag] from this checkout; ddev geo-install is unavailable.'"
